<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NakliPoster NakliOS storage harness</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;grid-template-rows:auto minmax(0,1fr);background:#171b28;color:#f5f1e8;font:12px ui-monospace,monospace}
    header{display:flex;align-items:center;gap:10px;padding:8px 12px}
    button{font:inherit;padding:5px 9px}
    [data-state="pass"]{color:#91d7a3}[data-state="fail"]{color:#ff9b8d}
    iframe{width:100%;height:100%;border:0;background:white}
  </style>
</head>
<body>
<header>
  <button id="run" type="button">Run Folder → Crate regression</button>
  <span id="status" role="status">Ready</span>
</header>
<iframe id="app" title="NakliPoster test app" src="../index.html"></iframe>
<script>
(()=>{
  const frame=document.getElementById('app');
  const run=document.getElementById('run');
  const status=document.getElementById('status');
  const collection=(id,name)=>({
    id,info:{name,_postman_id:id},items:[],variable:[],_open:false,
  });
  const workspace=(id,name)=>JSON.stringify({
    version:1,
    collections:[collection(id,name)],
    environments:[],globals:{},activeEnvId:null,
    savedAt:'2026-07-28T00:00:00.000Z',
  },null,2);
  const stores={
    fsa:new Map([['nakliposter-workspace.json',workspace('folder-coll','Folder Collection')]]),
    crate:new Map([['nakliposter-workspace.json',workspace('crate-coll','Crate Collection')]]),
  };
  let active='fsa';
  const caps=()=>({
    type:'naklios:capabilities',fs:true,fsBackend:active,
    fsBackends:[
      {id:'fsa',label:'Folder',name:'Harness Folder'},
      {id:'crate',label:'Crate',name:'Harness Crate'},
    ],
  });
  const send=message=>frame.contentWindow.postMessage(message,'*');
  const waitFor=(check,label,timeout=12000)=>new Promise((resolve,reject)=>{
    const started=performance.now();
    const poll=()=>{
      let value=null;
      try{ value=check(); }catch(_){}
      if(value){ resolve(value); return; }
      if(performance.now()-started>=timeout){ reject(new Error('Timed out waiting for '+label)); return; }
      setTimeout(poll,40);
    };
    poll();
  });
  const setStatus=(text,state='')=>{ status.textContent=text; status.dataset.state=state; };

  window.addEventListener('message',event=>{
    if(event.source!==frame.contentWindow) return;
    const msg=event.data;
    if(!msg||typeof msg!=='object') return;
    if(msg.type==='naklios:ready'||msg.type==='naklios:capabilities-request'){
      send(caps());
      return;
    }
    if(!String(msg.type||'').startsWith('naklios:fs:')) return;
    const op=msg.type.slice('naklios:fs:'.length);
    const reply={type:'naklios:fs:reply',requestId:msg.requestId};
    try{
      if(op==='selectBackend'){
        if(!stores[msg.backend]) throw new Error('Unknown backend');
        active=msg.backend;
        reply.result=true;
        send(caps());
      }else{
        const store=stores[active];
        if(op==='list') reply.result=[...store.keys()].filter(path=>path.startsWith(String(msg.prefix||'')));
        else if(op==='exists') reply.result=store.has(msg.path);
        else if(op==='read'){
          if(!store.has(msg.path)) throw new Error('Not found');
          reply.result=store.get(msg.path);
        }else if(op==='write'){ store.set(msg.path,String(msg.data)); reply.result=null; }
        else if(op==='delete'){ store.delete(msg.path); reply.result=null; }
        else throw new Error('Unsupported '+op);
      }
    }catch(error){ reply.error=error.message; }
    send(reply);
  });
  frame.addEventListener('load',()=>send(caps()));

  async function runRegression(){
    run.disabled=true;
    setStatus('Running · loading Folder workspace…');
    try{
      active='fsa';
      send(caps());
      const app=frame.contentDocument;
      await waitFor(()=>app.body.textContent.includes('Folder Collection'),'Folder collection');
      app.getElementById('btn-open-folder').click();
      const crateChoice=await waitFor(
        ()=>[...app.querySelectorAll('#storage-location-choices button')]
          .find(button=>button.textContent.includes('Crate')),
        'Crate storage choice',
      );
      crateChoice.click();
      await waitFor(()=>app.body.textContent.includes('Crate Collection'),'Crate collection');
      if(app.body.textContent.includes('Folder Collection')) throw new Error('Folder collection leaked into Crate view');
      const crateData=JSON.parse(stores.crate.get('nakliposter-workspace.json'));
      if(crateData.collections.some(item=>item.info?.name==='Folder Collection')) throw new Error('Folder workspace was copied to Crate');
      const folderData=JSON.parse(stores.fsa.get('nakliposter-workspace.json'));
      if(!folderData.collections.some(item=>item.info?.name==='Folder Collection')) throw new Error('Folder workspace was changed');
      setStatus('PASS · Folder and Crate stayed separate while the live workspace switched','pass');
    }catch(error){
      console.error(error);
      setStatus('FAIL · '+error.message,'fail');
    }finally{ run.disabled=false; }
  }
  run.addEventListener('click',runRegression);
  if(new URLSearchParams(location.search).get('autorun')==='1'){
    frame.addEventListener('load',()=>setTimeout(runRegression,0),{once:true});
  }
})();
</script>
</body>
</html>
